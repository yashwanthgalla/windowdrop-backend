services:
  - type: web
    name: dropcode-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: https://windowdrop.vercel.app,http://localhost:5173
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: STAGING_MASTER_KEY
        generateValue: true
      - key: CODE_PEPPER
        generateValue: true
      - key: IP_ENCRYPTION_KEY
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: dropcode-7568e
