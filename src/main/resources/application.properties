# ===================================================================
# DropCode Spring Boot Application Properties
# ===================================================================

# Server Configuration
server.port=${SERVER_PORT:4000}
server.servlet.context-path=/

# Spring Application
spring.application.name=dropcode-backend

# MySQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dropcode?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Yashwanth@1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Multipart & Large Upload Limits (Allows up to 10 GB for Pro Plan)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

# Actuator Endpoints & Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# CORS Configuration (Allowed frontend origins)
dropcode.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Ephemeral Staging Storage Buffer
dropcode.storage.local-dir=${STAGING_LOCAL_DIR:./staging-data}
dropcode.storage.s3-enabled=${S3_ENABLED:false}
dropcode.storage.s3-bucket=${S3_BUCKET:dropcode-staging-buffer}
dropcode.storage.s3-region=${AWS_REGION:ap-south-1}

# Cryptography & Security Keys
dropcode.security.staging-master-key=${STAGING_MASTER_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
dropcode.security.code-pepper=${CODE_PEPPER:dropcode-secure-code-pepper-key-minimum-32-chars-long}
dropcode.security.ip-encryption-key=${IP_ENCRYPTION_KEY:12345678901234567890123456789012}

# Firebase Authentication
dropcode.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
dropcode.firebase.project-id=${FIREBASE_PROJECT_ID:dropcode-7568e}

# Razorpay Payments Integration (Test or Production)
dropcode.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_dropcode123}
dropcode.razorpay.key-secret=${RAZORPAY_KEY_SECRET:test_secret_dropcode_456}
dropcode.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:test_webhook_dropcode_789}

# Transfer Limits & Lifecycle Rules
dropcode.limits.code-ttl-seconds=300
dropcode.limits.download-window-seconds=900
dropcode.limits.max-code-attempts=5
dropcode.limits.lockout-duration-seconds=900
dropcode.limits.free-limit-bytes=500000000
dropcode.limits.standard-limit-bytes=5000000000
dropcode.limits.max-transfer-bytes=10000000000
dropcode.limits.audit-retention-days=90
