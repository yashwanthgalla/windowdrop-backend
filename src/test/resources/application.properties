# ===================================================================
# DropCode Test Application Properties (H2 In-Memory Database)
# ===================================================================

server.port=0

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

dropcode.cors.allowed-origins=http://localhost:5173,http://localhost:3000
dropcode.storage.local-dir=./target/test-staging-data
dropcode.storage.s3-enabled=false

dropcode.security.staging-master-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
dropcode.security.code-pepper=dropcode-secure-code-pepper-key-minimum-32-chars-long
dropcode.security.ip-encryption-key=12345678901234567890123456789012

dropcode.firebase.project-id=dropcode-test
